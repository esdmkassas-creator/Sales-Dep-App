{% extends "base.html" %}{% block body %}
<div class="top"><h1>Clients</h1><a class="btn" href="{{ url_for('client_form') }}">Add client</a></div>
<form class="card row"><input name="q" value="{{ q }}" placeholder="Search by name"><button>Search</button></form>
<div class="card"><table><tr><th>Name</th><th>Industry</th><th>Contact</th><th>Deals</th></tr>
{% for c in rows %}<tr><td><a href="{{ url_for('client', id=c.id) }}">{{ c.name }}</a></td><td>{{ c.industry }}</td><td>{{ c.contact_name }}</td><td>{{ c.deals|length }}</td></tr>
{% else %}<tr><td colspan="4" class="mut">No clients yet. Add your first client.</td></tr>{% endfor %}</table></div>{% endblock %}
